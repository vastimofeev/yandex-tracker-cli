name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to publish, for example v1.3.0"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
            artifact: yt-windows-amd64.exe
          - goos: linux
            goarch: amd64
            artifact: yt-linux-amd64
          - goos: darwin
            goarch: amd64
            artifact: yt-darwin-amd64
          - goos: darwin
            goarch: arm64
            artifact: yt-darwin-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test ./...

      - name: Set release metadata
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "COMMIT=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Build binary
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -ldflags "-X main.buildVersion=${VERSION} -X main.buildCommit=${COMMIT} -X main.buildDate=${BUILD_DATE}" -o "${{ matrix.artifact }}" ./cmd/yandex-tracker-cli

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download workflow artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Flatten artifact layout
        shell: bash
        run: |
          find dist -mindepth 2 -maxdepth 2 -type f -print0 | while IFS= read -r -d '' file; do
            mv "$file" "dist/$(basename "$file")"
          done

      - name: Set release metadata
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release view "${VERSION}" -R "${GITHUB_REPOSITORY}" >/dev/null 2>&1 || \
            gh release create "${VERSION}" -R "${GITHUB_REPOSITORY}" --title "${VERSION}" --notes "Automated release ${VERSION}"

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          find dist -maxdepth 1 -type f -print0 | while IFS= read -r -d '' file; do
            gh release upload "${VERSION}" "$file" -R "${GITHUB_REPOSITORY}" --clobber
          done

      - name: Generate checksums
        shell: bash
        run: |
          cd dist
          sha256sum yt-* > checksums.txt

      - name: Upload assets to Selectel S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SELECTEL_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SELECTEL_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.SELECTEL_S3_REGION }}
          SELECTEL_S3_ENDPOINT: ${{ secrets.SELECTEL_S3_ENDPOINT }}
          SELECTEL_S3_BUCKET: ${{ secrets.SELECTEL_S3_BUCKET }}
        shell: bash
        run: |
          : "${AWS_DEFAULT_REGION:=ru-1}"
          : "${SELECTEL_S3_ENDPOINT:=https://s3.ru-1.storage.selcloud.ru}"
          : "${SELECTEL_S3_BUCKET:=yandex-tracker-cli}"
          aws --endpoint-url "${SELECTEL_S3_ENDPOINT}" s3 cp dist/yt-windows-amd64.exe "s3://${SELECTEL_S3_BUCKET}/releases/${VERSION}/yt-windows-amd64.exe"
          aws --endpoint-url "${SELECTEL_S3_ENDPOINT}" s3 cp dist/yt-linux-amd64 "s3://${SELECTEL_S3_BUCKET}/releases/${VERSION}/yt-linux-amd64"
          aws --endpoint-url "${SELECTEL_S3_ENDPOINT}" s3 cp dist/yt-darwin-amd64 "s3://${SELECTEL_S3_BUCKET}/releases/${VERSION}/yt-darwin-amd64"
          aws --endpoint-url "${SELECTEL_S3_ENDPOINT}" s3 cp dist/yt-darwin-arm64 "s3://${SELECTEL_S3_BUCKET}/releases/${VERSION}/yt-darwin-arm64"
          aws --endpoint-url "${SELECTEL_S3_ENDPOINT}" s3 cp dist/checksums.txt "s3://${SELECTEL_S3_BUCKET}/releases/${VERSION}/checksums.txt"
          aws --endpoint-url "${SELECTEL_S3_ENDPOINT}" s3 cp dist/yt-windows-amd64.exe "s3://${SELECTEL_S3_BUCKET}/latest/windows/yt.exe"
          aws --endpoint-url "${SELECTEL_S3_ENDPOINT}" s3 cp dist/yt-linux-amd64 "s3://${SELECTEL_S3_BUCKET}/latest/yt-linux-amd64"
          aws --endpoint-url "${SELECTEL_S3_ENDPOINT}" s3 cp dist/yt-darwin-amd64 "s3://${SELECTEL_S3_BUCKET}/latest/yt-darwin-amd64"
          aws --endpoint-url "${SELECTEL_S3_ENDPOINT}" s3 cp dist/yt-darwin-arm64 "s3://${SELECTEL_S3_BUCKET}/latest/yt-darwin-arm64"
          aws --endpoint-url "${SELECTEL_S3_ENDPOINT}" s3 cp scripts/install.ps1 "s3://${SELECTEL_S3_BUCKET}/latest/install.ps1"
          aws --endpoint-url "${SELECTEL_S3_ENDPOINT}" s3 cp scripts/update.ps1 "s3://${SELECTEL_S3_BUCKET}/latest/update.ps1"
          aws --endpoint-url "${SELECTEL_S3_ENDPOINT}" s3 cp install-yt.bat "s3://${SELECTEL_S3_BUCKET}/latest/install-yt.bat"
          aws --endpoint-url "${SELECTEL_S3_ENDPOINT}" s3 cp update-yt.bat "s3://${SELECTEL_S3_BUCKET}/latest/update-yt.bat"
